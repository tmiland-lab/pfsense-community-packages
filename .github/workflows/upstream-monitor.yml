name: Upstream monitor

on:
  schedule:
    - cron: '13 7 * * *'  # daily 07:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  LOG_REPO: tmiland-lab/pfsense-community-packages
  LOG_ISSUE: '2'  # "Upstream activity log"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report new upstream activity
        env:
          GH_TOKEN: ${{ github.token }}
          ACT: '1'
        run: |
          git config user.name "tmiland-lab[bot]"
          git config user.email "4862101+tmiland-lab[bot]@users.noreply.github.com"
          python3 .github/scripts/upstream-monitor.py
          if git status --porcelain .github/monitor-state.json | grep -q .; then
            git add .github/monitor-state.json
            git commit -m "monitor: state refresh $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
            git push
          fi
