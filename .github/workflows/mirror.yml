name: Mirror + build repo

on:
  schedule:
    - cron: '0 7 * * *'  # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # Sigstore OIDC for the build attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the manager version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<.*/\1/p' \
            pkg/files/usr-local-pfsense-community/share/community.xml | head -1)
          [ -n "$VERSION" ] || { echo "::error::cannot read the manager version from community.xml"; exit 1; }
          echo "MANAGER_VERSION=$VERSION" >> $GITHUB_ENV
          PKG="pfSense-pkg-community-$VERSION.pkg"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Republish the released bytes so the checksum moves only with the
            # version. build.sh rebuilds anyway and fails on any drift.
            # Must live INSIDE the workspace to be visible in the FreeBSD VM.
            mkdir -p "$GITHUB_WORKSPACE/.manager-release"
            gh release download "v$VERSION" -p "$PKG" -D "$GITHUB_WORKSPACE/.manager-release"
            echo "MANAGER_PKG=$GITHUB_WORKSPACE/.manager-release/$PKG" >> $GITHUB_ENV
          else
            echo "MANAGER_PKG=" >> $GITHUB_ENV
            echo "RELEASE_MANAGER=1" >> $GITHUB_ENV
          fi

      - name: Write signing key
        run: |
          if [ -n "${{ secrets.COMMUNITY_SIGNING_KEY }}" ]; then
            # Must live INSIDE the workspace: vmactions bind-mounts it into
            # the VM at the same path; /tmp is not shared.
            printf '%s\n' "${{ secrets.COMMUNITY_SIGNING_KEY }}" > "$GITHUB_WORKSPACE/.community-signing.key"
            chmod 600 "$GITHUB_WORKSPACE/.community-signing.key"
            echo "SIGN_KEY=$GITHUB_WORKSPACE/.community-signing.key" >> $GITHUB_ENV
          else
            echo "SIGN_KEY=" >> $GITHUB_ENV
            echo "::warning::COMMUNITY_SIGNING_KEY secret not set - repo will be built unsigned"
          fi

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15'
          usesh: true
          # The workspace is bind-mounted into the VM, so OUT_DIR must live
          # there for the host-side deploy step to see the build output.
          # SIGN_KEY points at the workspace copy of the signing key.
          envs: 'OUT_DIR SIGN_KEY MANAGER_PKG'
          prepare: |
            pkg install -y pkg openssl php82 2>/dev/null || pkg install -y pkg openssl php83
          run: |
            OUT_DIR=$GITHUB_WORKSPACE/out sh pkg/build.sh

      - name: Attest the manager package
        if: success() && env.RELEASE_MANAGER == '1'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/repo/All/pfSense-pkg-community-${{ env.MANAGER_VERSION }}.pkg

      - name: Publish the manager release
        if: success() && env.RELEASE_MANAGER == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="pfSense-pkg-community-$MANAGER_VERSION.pkg"
          cd "$GITHUB_WORKSPACE/out/repo/All" || exit 1
          sha256sum "$PKG" > "$PKG.sha256"
          gh release create "v$MANAGER_VERSION" "$PKG" "$PKG.sha256" \
            --title "Community Packages manager $MANAGER_VERSION" \
            --notes "Manager package as published to the repository. Later refreshes
          re-publish these exact bytes, so the checksum below stays valid for as long
          as $MANAGER_VERSION is the current version.

          Verify the build provenance:

          \`\`\`sh
          gh attestation verify $PKG --repo $GITHUB_REPOSITORY
          \`\`\`"

      - name: Deploy to gh-pages
        if: success()
        run: |
          git config user.name "tmiland-lab[bot]"
          git config user.email "4862101+tmiland-lab[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          rm -rf gh-pages/repo gh-pages/index.html
          mkdir -p gh-pages/repo
          # -L: pkg(8) ships packagesite.txz/data.txz as symlinks to the .pkg
          # files. Committed as symlinks, GitHub Pages serves the link TEXT
          # and PUBKEY signature validation breaks on the box.
          cp -aL "$GITHUB_WORKSPACE"/out/repo/. gh-pages/repo/
          cp "$GITHUB_WORKSPACE"/out/index.html gh-pages/index.html
          cd gh-pages
          git add -A index.html repo
          git commit -m "mirror: repo refresh $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin HEAD:gh-pages

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.community-signing.key"
